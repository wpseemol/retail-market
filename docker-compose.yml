services:
  mysql:
    image: mysql:8.0
    container_name: retail_market_mysql
    restart: unless-stopped
    volumes:
      - retail_market_mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retail_market}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - retail_market_network

  phpmyadmin:
    image: phpmyadmin:5
    container_name: retail_market_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8183}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - retail_market_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: retail_market_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/${MYSQL_DATABASE:-retail_market}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - retail_market_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: retail_market_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    networks:
      - retail_market_network

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
    container_name: retail_market_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - retail_market_network

networks:
  retail_market_network:
    driver: bridge

volumes:
  retail_market_mysql_data:
    name: retail_market_mysql_data
