<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Niyenin API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        color: #1c1915;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
        padding: 2rem;
        background: #fff;
        border: 1px solid #e4ddd0;
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The API is not running</h1>
      <p>
        The Node.js application is stopped. This address does not list files,
        source code, or credentials. Start the API from the hosting panel, then
        open <code>/api/health</code>.
      </p>
    </main>
  </body>
</html>
