# Production stack. Copy .env.production.example to .env.production, then:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Public URLs are baked into the storefront and dashboard at build time.
# Change STOREFRONT_URL, DASHBOARD_URL, or API_URL, then build again.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: retail_market_prod_mysql
    restart: unless-stopped
    init: true
    logging: *default-logging
    volumes:
      - retail_market_prod_mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retail_market}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - retail_market_network

  backend:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    image: retail_market_backend:prod
    container_name: retail_market_prod_backend
    restart: unless-stopped
    init: true
    logging: *default-logging
    stop_grace_period: 20s
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8001}:8001"
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-retail_market}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 bytes}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY to at least 32 bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      PUBLIC_API_URL: ${API_URL:?Set API_URL}
      FRONTEND_URL: ${STOREFRONT_URL:?Set STOREFRONT_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
      APP_NAME: ${APP_NAME:-Niyenin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-365d}
    volumes:
      - retail_market_prod_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - retail_market_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:?Set API_URL}
        NEXT_PUBLIC_APP_URL: ${STOREFRONT_URL:?Set STOREFRONT_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${DASHBOARD_URL:?Set DASHBOARD_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-}
        NEXT_IMAGE_UNOPTIMIZED: ${NEXT_IMAGE_UNOPTIMIZED:-0}
    image: retail_market_frontend:prod
    container_name: retail_market_prod_frontend
    restart: unless-stopped
    init: true
    logging: *default-logging
    stop_grace_period: 20s
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://backend:8001
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to at least 32 bytes}
      AUTH_URL: ${STOREFRONT_URL:?Set STOREFRONT_URL}
      AUTH_TRUST_HOST: "true"
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - retail_market_network

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_URL: ${API_URL:?Set API_URL}
        VITE_APP_URL: ${DASHBOARD_URL:?Set DASHBOARD_URL}
        VITE_STOREFRONT_URL: ${STOREFRONT_URL:?Set STOREFRONT_URL}
    image: retail_market_dashboard:prod
    container_name: retail_market_prod_dashboard
    restart: unless-stopped
    init: true
    logging: *default-logging
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-4173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - retail_market_network

networks:
  retail_market_network:
    driver: bridge

volumes:
  retail_market_prod_mysql:
    name: retail_market_prod_mysql
  retail_market_prod_uploads:
    name: retail_market_prod_uploads
