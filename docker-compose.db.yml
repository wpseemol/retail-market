# MySQL + phpMyAdmin only (apps run on the host / WSL).
# Same volume name as docker-compose.yml so existing local data is reused.
#
# From WSL Ubuntu (current):
#   docker compose -f docker-compose.db.yml --env-file .env up -d
#
# Later from Windows Docker: same command; volume name stays retail_market_mysql_data.
# Point backend DATABASE_URL at 127.0.0.1:3306 (see backend-api/.env.example).

services:
  mysql:
    image: mysql:8.0
    container_name: retail_market_mysql
    restart: unless-stopped
    volumes:
      - retail_market_mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retail_market}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - retail_market_network

  phpmyadmin:
    image: phpmyadmin:5
    container_name: retail_market_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8183}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - retail_market_network

networks:
  retail_market_network:
    driver: bridge

volumes:
  retail_market_mysql_data:
    name: retail_market_mysql_data
