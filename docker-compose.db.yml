# Local Docker deps for day-to-day `pnpm dev` (apps run on the host / WSL):
#   MySQL + phpMyAdmin + Mailpit (dev mail) + SMS catcher (phone OTP inbox) + Redis
# Same MySQL volume name as docker-compose.yml so existing local data is reused.
#
# From WSL Ubuntu (current):
#   docker compose -f docker-compose.db.yml --env-file .env up -d
#   # or: pnpm docker:db   /   pnpm docker:dev
#
# Later from Windows Docker: same command; volume name stays retail_market_mysql_data.
# Point backend DATABASE_URL at 127.0.0.1:3306 (see backend-api/.env.example).
# Point SMTP_* at Mailpit and SMS_* at the SMS catcher (defaults in .env.example).

services:
  mysql:
    image: mysql:8.0
    container_name: retail_market_mysql
    restart: unless-stopped
    volumes:
      - retail_market_mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retail_market}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - retail_market_network

  phpmyadmin:
    image: phpmyadmin:5
    container_name: retail_market_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8183}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - retail_market_network

  # Catches all SMTP from the API (verification codes, dashboard test mail).
  # Web UI: http://localhost:8025  · SMTP: localhost:1025 (no auth)
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: retail_market_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - retail_market_network

  # Catches phone OTP SMS (BulkSMSBD-shaped GET /api/smsapi).
  # Inbox UI: http://localhost:8026
  sms-catcher:
    build:
      context: ./dev/sms-catcher
      dockerfile: Dockerfile
    image: retail_market_sms_catcher
    container_name: retail_market_sms_catcher
    restart: unless-stopped
    ports:
      - "${SMS_CATCHER_PORT:-8026}:8026"
    environment:
      PORT: 8026
    networks:
      - retail_market_network

  # Optional shared rate-limit + public GET cache for the API.
  # Point backend REDIS_URL at redis://127.0.0.1:6379 (leave empty for in-memory).
  redis:
    image: redis:7-alpine
    container_name: retail_market_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - retail_market_network

networks:
  retail_market_network:
    driver: bridge

volumes:
  retail_market_mysql_data:
    name: retail_market_mysql_data
